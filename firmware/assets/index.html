<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GC Nano Jewel</title>
    <style>
      /* Design tokens — update these to retheme the entire UI */
      :root {
        --color-bg: #0d0d0d;
        --color-surface: #1a1a1a;
        --color-surface-raised: #222;
        --color-border: #2a2a2a;
        --color-text: #e0e0e0;
        --color-text-subtle: #aaa;
        --color-muted: #888;
        --color-dim: #555;
        --color-accent: #4b3fcb;
        --color-input-bg: #111;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--color-bg);
        color: var(--color-text);
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Card flip scene ── */
      .card-scene {
        width: 100%;
        max-width: 420px;
        perspective: 1000px;
      }
      .card-inner {
        width: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s ease;
      }
      .card-inner.flipped {
        transform: rotateY(180deg);
      }
      .card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 24px;
        width: 100%;
        min-height: 400px;
        text-align: center;
        position: relative;
        backface-visibility: hidden;
        display: flex;
        flex-direction: column;
      }
      .card-back {
        position: absolute;
        inset: 0;
        transform: rotateY(180deg);
        display: flex;
        flex-direction: column;
      }

      /* ── Icon buttons (cog / close) ── */
      .icon-btn {
        background: none;
        border: none;
        padding: 4px;
        color: #444;
        cursor: pointer;
        transition: color 0.2s;
        font-size: 0;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        color: var(--color-muted);
      }
      .icon-btn svg {
        display: block;
      }

      /* ── Page layout (header / content / actions) ── */
      .page {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .page-header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding-bottom: 20px;
        flex-shrink: 0;
      }
      .page-title-text,
      svg.title {
        grid-column: 2;
      }
      .page-header .icon-btn {
        grid-column: 3;
        justify-self: end;
      }
      .page-title-text {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--color-muted);
      }
      svg.title {
        width: 160px;
        height: auto;
      }
      .page-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 0;
      }
      .gallery-loaded .page-content {
        justify-content: flex-start;
      }
      .page-actions {
        padding-top: 8px;
        flex-shrink: 0;
      }
      p {
        font-size: 0.85rem;
        color: var(--color-dim);
        margin: 20px 0;
      }

      /* ── Drag-and-drop zone ── */
      .drop {
        border: 2px dashed #333;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .drop:hover,
      .drop.over {
        border-color: var(--color-dim);
        background: var(--color-surface-raised);
      }
      .drop svg {
        width: 32px;
        height: 32px;
        opacity: 0.4;
      }
      .drop span {
        font-size: 0.9rem;
        color: var(--color-muted);
      }
      .drop small {
        font-size: 0.75rem;
        color: var(--color-dim);
      }
      #file {
        display: none;
      }
      .selection-pill {
        display: flex;
        width: 100%;
        box-sizing: border-box;
        align-items: center;
        margin: 0 0 8px;
        padding: 3px 8px 3px 12px;
        border-radius: 8px;
        background: var(--color-surface-raised);
        border: 1px solid var(--color-border);
        font-size: 0.78rem;
        color: var(--color-text-subtle);
      }
      .selection-pill.error {
        color: #e55;
        border-color: rgba(238, 85, 85, 0.35);
        background: rgba(238, 85, 85, 0.06);
      }
      .selection-pill span {
        flex: 1;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .selection-pill button {
        flex-shrink: 0;
        margin-left: auto;
        background: none;
        border: none;
        padding: 2px;
        cursor: pointer;
        color: var(--color-dim);
        display: flex;
        align-items: center;
        border-radius: 50%;
      }
      .selection-pill button:hover {
        color: var(--color-text-subtle);
        background: var(--color-border);
      }

      /* ── Buttons ── */
      .btn-primary,
      .btn-secondary {
        width: 100%;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .btn-primary {
        border: none;
        font-weight: 600;
        background: var(--color-accent);
        color: #fff;
        transition: opacity 0.2s, background-image 0.1s;
      }
      .btn-primary:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .btn-primary.uploading,
      .btn-secondary.uploading {
        cursor: default;
        opacity: 1;
        background-image: linear-gradient(
          to right,
          rgba(255, 255, 255, 0.2) var(--upload-progress, 0%),
          transparent var(--upload-progress, 0%)
        );
      }
      .btn-primary.uploaded {
        opacity: 1;
        cursor: default;
      }
      .btn-secondary {
        background: #1e1e1e;
        color: var(--color-text-subtle);
        border: 1px solid var(--color-border);
        font-weight: 500;
      }
      .btn-secondary:hover:not(:disabled) {
        background: #252525;
        color: #ccc;
      }
      /* ── Settings back card ── */
      .settings-heading {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--color-muted);
        text-transform: uppercase;
        margin: 0 0 5px;
      }
      .settings-divider {
        border: none;
        border-top: 1px solid var(--color-border);
        margin: 12px 0;
      }

      /* ── Upload / OTA progress bar ── */
      .bar-wrap {
        margin-top: 8px;
        background: var(--color-surface-raised);
        border-radius: 4px;
        overflow: hidden;
        height: 6px;
        display: none;
      }
      .bar {
        height: 6px;
        width: 0;
        background: #fff;
        transition: width 0.1s;
      }

      /* ── Status / error messages ── */
      .msg:not(:empty) {
        margin-top: 8px;
        font-size: 0.85rem;
        color: var(--color-muted);
      }

      /* ── GIF gallery grid ── */
      #gallery {
        display: none;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 6px;
        margin: -6px;
      }
      .gallery-item {
        aspect-ratio: 1;
        border-radius: 50%;
        overflow: hidden;
        background: #000;
        border: 8px solid #000;
        box-shadow: 0 0 0 2px var(--color-border);
        cursor: pointer;
        transition:
          box-shadow 0.15s,
          opacity 0.15s;
        opacity: 0.7;
      }
      .gallery-item:hover,
      .gallery-item.selected {
        opacity: 1;
        box-shadow: 0 0 0 3px var(--color-bg), 0 0 0 5px var(--color-accent);
      }
      #gallery img {
        width: 100%;
        display: block;
      }

      /* ── Settings locked state ── */
      #settings-locked {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 0 8px;
      }
      #settings-locked svg {
        opacity: 0.2;
      }

      /* ── Form inputs ── */
      .lock-input,
      .settings-field input {
        background: var(--color-input-bg);
        border: 1px solid var(--color-border);
        border-radius: 6px;
        color: var(--color-text);
        outline: none;
        transition: border-color 0.15s;
      }
      .lock-input:focus,
      .settings-field input:focus {
        border-color: #444;
      }
      .lock-input {
        width: 100%;
        padding: 8px 10px;
        font-size: 0.875rem;
        text-align: center;
      }
      .settings-field input {
        padding: 6px 8px;
        font-size: 0.8rem;
      }

      /* ── Settings unlocked state ── */
      #settings-unlocked {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
      }
.settings-field {
        display: grid;
        grid-template-columns: 1fr 1.6fr;
        align-items: center;
        gap: 8px;
      }
      .settings-field label {
        font-size: 0.75rem;
        color: var(--color-dim);
        text-align: left;
      }
      input::placeholder {
        color: #2e2e2e;
      }

      /* SVG icon symbols — styles cascade through <use> shadow DOM */
      symbol {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5px;
      }
    </style>
  </head>
  <body>
    <!-- Reusable SVG icon symbols, referenced via <use href="#icon-*"> -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
      <symbol id="icon-cog" viewBox="0 0 24 24">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />

          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
        />
      </symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18" />

        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </symbol>
    </svg>

    <div class="card-scene">
      <div class="card-inner" id="card-inner">
        <!-- Front of the card: GIF gallery and upload interface -->
        <div class="card card-front">
          <div class="page">
            <header class="page-header">
              <svg class="title" viewBox="3.0619 4.3606 94.74 11.296" aria-label="GC NANO">
                <path
                  d="m9.6517 8.8056v2.1026h4.1204v2.3848h-7.9587v-6.5334h10.724v-2.3989h-11.331q-2.1449 0.098778-2.1449 1.3406v8.3114q0.11289 1.6369 1.6369 1.6369h9.8637q1.9756-0.11289 1.9756-1.6369l-0.014111-5.207zm18.349-2.032h-7.6764v6.5193h7.7047v-2.3848h2.7658l0.01411 3.0903q0.127 1.0301-1.0301 1.4393-0.49389 0.18344-1.1853 0.21167-1.8062 0.01411-9.3839 0-1.524 0-1.6369-1.6369 0.02822-2.0602 0-8.3114 0-1.2418 2.1449-1.3406h8.89q2.0179 0 2.1731 1.3406v3.1186h-2.7799zm19.426 8.8759h2.8646v-11.289h-2.8646v7.2531l-8.8618-7.2531h-2.8081v11.289h2.8081l0.01411-7.4648zm17.164 0-4.6143-8.1985-3.2597 5.8138h3.2597v2.3848h-8.3255l1.016-1.6651 5.7573-9.6238h3.0903l6.4206 11.289zm15.766 0h2.8646v-11.289h-2.8646v7.2531l-8.8618-7.2531h-2.8081v11.289h2.8081l0.01411-7.4648zm17.446-1.5946q0 1.4817-2.0461 1.5946-1.8062 0.01411-9.5391 0-1.524 0-1.6369-1.6369 0.02822-2.0602 0-8.3114 0-1.2418 2.1449-1.3406h9.0311q1.8909 0 2.032 1.2841zm-2.794-0.77611v-6.5052h-7.6764v6.5052z"
                  fill="#fff"
                />
              </svg>
              <button class="icon-btn" id="show-settings-btn" aria-label="Settings">
                <svg width="18" height="18"><use href="#icon-cog" /></svg>
              </button>
            </header>

            <div class="page-content">
              <!-- Pre-made GIF gallery, populated dynamically from GitHub -->
              <div id="gallery"></div>
              <p id="upload-label" style="display: none">or upload your own...</p>
              <label class="drop" id="drop">
                <svg><use href="#icon-upload" /></svg>
                <span>Drop a GIF here</span>
                <small>or click to browse</small>
                <input type="file" id="file" accept=".gif,image/gif" />
              </label>
            </div>

            <div class="page-actions">
              <div class="selection-pill" id="selection-pill" style="display:none">
                <span id="selection-text"></span>
                <button type="button" id="selection-clear" aria-label="Clear selection">
                  <svg width="12" height="12"><use href="#icon-close"/></svg>
                </button>
              </div>
              <button id="upload-btn" class="btn-primary" disabled>Upload</button>
            </div>
          </div>
        </div>

        <!-- Back of the card: Settings and firmware update -->
        <div class="card card-back">

          <!-- Locked state page -->
          <div class="page" id="settings-locked-page">
            <header class="page-header">
              <span class="page-title-text">Settings</span>
              <button class="icon-btn close-settings-btn" aria-label="Close settings">
                <svg width="18" height="18"><use href="#icon-close" /></svg>
              </button>
            </header>
            <div class="page-content" id="settings-locked">
              <svg width="28" height="28"><use href="#icon-lock" /></svg>
              <p>Enter password to unlock settings</p>
              <input type="password" id="lock-pass" class="lock-input" autocomplete="off" />
              <div id="unlock-msg" class="msg"></div>
            </div>
            <div class="page-actions">
              <button id="unlock-settings-btn" class="btn-primary">Unlock</button>
            </div>
          </div>

          <!-- Unlocked state page -->
          <div class="page" id="settings-unlocked-page" style="display: none">
            <header class="page-header">
              <span class="page-title-text">Settings</span>
              <button class="icon-btn close-settings-btn" aria-label="Close settings">
                <svg width="18" height="18"><use href="#icon-close" /></svg>
              </button>
            </header>
            <div class="page-content" id="settings-unlocked">
              <!-- WiFi / network settings -->
              <div class="settings-field">
                <label for="s-ssid">SSID</label>
                <input type="text" id="s-ssid" autocomplete="off" spellcheck="false" />
              </div>
              <div class="settings-field">
                <label for="s-pass">Wi-Fi password</label>
                <input type="password" id="s-pass" autocomplete="off" />
              </div>
              <div class="settings-field">
                <label for="s-settingspass">Settings password</label>
                <input
                  type="password"
                  id="s-settingspass"
                  autocomplete="off"
                  placeholder="Leave blank to keep current"
                />
              </div>
              <button id="settings-save-btn" class="btn-secondary">Save &amp; Reboot</button>
              <button id="lock-settings-btn" class="btn-secondary">Lock Settings</button>

              <hr class="settings-divider" />

              <!-- OTA firmware update -->
              <p class="settings-heading">Firmware Update</p>
              <div class="settings-field">
                <label for="ota-file">Firmware (.bin)</label>
                <input type="file" id="ota-file" accept=".bin" />
              </div>
              <button id="ota-btn" class="btn-secondary">Update Firmware</button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script>
      // ── DOM references ───────────────────────────────────────────────────────

      const cardInner = document.getElementById('card-inner');
      const cardFront = document.querySelector('.card-front');

      // Settings card pages
      const settingsLockedPage = document.getElementById('settings-locked-page');
      const settingsUnlockedPage = document.getElementById('settings-unlocked-page');

      // Lock / unlock controls
      const lockPassInput = document.getElementById('lock-pass');
      const unlockSettingsBtn = document.getElementById('unlock-settings-btn');
      const unlockMsgEl = document.getElementById('unlock-msg');
      const lockSettingsBtn = document.getElementById('lock-settings-btn');
      const showSettingsBtn = document.getElementById('show-settings-btn');
      document.querySelectorAll('.close-settings-btn').forEach(btn => {
        btn.addEventListener('click', () => cardInner.classList.remove('flipped'));
      });

      // WiFi settings form fields
      const ssidInput = document.getElementById('s-ssid');
      const wifiPassInput = document.getElementById('s-pass');
      const settingsPassInput = document.getElementById('s-settingspass');
      const settingsSaveBtn = document.getElementById('settings-save-btn');

      // OTA firmware update controls
      const otaBtn = document.getElementById('ota-btn');
      const otaFileInput = document.getElementById('ota-file');

      // GIF upload controls
      const dropZone = document.getElementById('drop');
      const fileInput = document.getElementById('file');
      const uploadBtn = document.getElementById('upload-btn');
      const uploadLabel = document.getElementById('upload-label');
      const selectionPill = document.getElementById('selection-pill');
      const selectionText = document.getElementById('selection-text');
      document.getElementById('selection-clear').addEventListener('click', () => {
        clearGallerySelection();
        setFile(null);
      });
      const gallery = document.getElementById('gallery');

      // ── State ────────────────────────────────────────────────────────────────

      // Whether the settings panel is currently unlocked on the device.
      let isUnlocked = false;

      // The File object staged for upload, or null if nothing is selected.
      let selectedFile = null;

      // ── Helpers ──────────────────────────────────────────────────────────────

      // Sets a status or error message on a given element.
      function setMessage(el, text, isError = false) {
        el.textContent = text;
        el.style.color = isError ? '#e55' : '#888';
      }

      // Shows or hides the selection pill. Pass null to hide it.
      function setSelectionPill(label, isError = false) {
        selectionPill.style.display = label ? 'flex' : 'none';
        selectionText.textContent = label ?? '';
        selectionPill.classList.toggle('error', isError);
      }

      // Temporarily sets button text to a status/error message, then restores it.
      // Pass resetText: null to leave the button in the final state (e.g. after reboot).
      function flashBtn(btn, text, { error = false, resetText = null, resetDelay = 2500 } = {}) {
        btn.textContent = text;
        btn.style.color = error ? '#e55' : '';
        btn.disabled = true;
        if (resetText !== null) {
          setTimeout(() => {
            btn.textContent = resetText;
            btn.style.color = '';
            btn.disabled = false;
          }, resetDelay);
        }
      }

      // Uploads formData to url via XHR, showing progress inside the button.
      // XHR is used instead of fetch because the Fetch API does not expose upload progress events.
      function uploadWithProgress(url, formData, { button, uploadingText, onSuccess, onError }) {
        const req = new XMLHttpRequest();
        req.open('POST', url);
        button.disabled = true;
        button.textContent = uploadingText;
        button.classList.add('uploading');
        button.style.setProperty('--upload-progress', '0%');
        req.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) {
            button.style.setProperty('--upload-progress', `${Math.round((e.loaded / e.total) * 100)}%`);
          }
        });
        req.onload = () => {
          button.classList.remove('uploading');
          button.style.removeProperty('--upload-progress');
          if (req.status === 200) onSuccess(req.responseText);
          else onError(req.responseText);
        };
        req.send(formData);
      }

      // Switches between the locked and unlocked settings views. When unlocking,
      // fetches current settings from the device to populate the form.
      async function setSettingsState(isLocked) {
        settingsLockedPage.style.display = isLocked ? 'flex' : 'none';
        settingsUnlockedPage.style.display = isLocked ? 'none' : 'flex';
        if (isLocked) {
          lockPassInput.value = '';
          unlockMsgEl.textContent = '';
        } else {
          settingsSaveBtn.textContent = 'Save & Reboot';
          settingsSaveBtn.style.color = '';
          settingsSaveBtn.disabled = false;
          lockSettingsBtn.textContent = 'Lock Settings';
          lockSettingsBtn.disabled = false;
          try {
            const response = await fetch('/settings');
            if (!response.ok) return;
            const settings = await response.json();
            ssidInput.value = settings.ssid;
            wifiPassInput.value = '';
            wifiPassInput.placeholder = settings.hasPassword ? 'leave blank to keep current' : '';
          } catch {
            // ignore — form fields just stay empty
          }
        }
      }

      // ── Settings card ────────────────────────────────────────────────────────

      showSettingsBtn.addEventListener('click', async () => {
        cardInner.classList.add('flipped');

        // Query the device for its current lock state.
        try {
          const response = await fetch('/lock');
          isUnlocked = response.ok && (await response.text()) === 'false';
        } catch {
          isUnlocked = false;
        }

        setSettingsState(!isUnlocked);
      });


      // Submits the unlock password to the device and transitions to unlocked view on success.
      async function unlockSettings() {
        const password = lockPassInput.value;
        unlockMsgEl.textContent = '';
        try {
          const response = await fetch('/lock', {
            method: 'DELETE',
            body: new URLSearchParams({ password }),
          });
          if (response.ok) {
            isUnlocked = true;
            setSettingsState(false);
          } else {
            setMessage(unlockMsgEl, await response.text(), true);
          }
        } catch {
          setMessage(unlockMsgEl, 'Failed to connect.', true);
        }
      }

      // Allow submitting the password with the Enter key.
      lockPassInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') unlockSettings();
      });

      unlockSettingsBtn.addEventListener('click', unlockSettings);

      lockSettingsBtn.addEventListener('click', async () => {
        lockSettingsBtn.textContent = 'Locking...';
        lockSettingsBtn.disabled = true;
        await fetch('/lock', { method: 'PUT' });
        isUnlocked = false;
        setSettingsState(true);
      });

      settingsSaveBtn.addEventListener('click', async () => {
        const ssid = ssidInput.value.trim();
        const pass = wifiPassInput.value;
        const settingspass = settingsPassInput.value;
        settingsSaveBtn.disabled = true;
        try {
          const params = { ssid, settingspass };
          // Only include pass if the user typed one (blank = keep current).
          if (pass) params.pass = pass;
          const response = await fetch('/settings', {
            method: 'POST',
            body: new URLSearchParams(params),
          });
          if (response.ok) {
            flashBtn(settingsSaveBtn, 'Saved. Rebooting...', { resetText: null });
          } else {
            flashBtn(settingsSaveBtn, 'Save failed', { error: true, resetText: 'Save & Reboot' });
          }
        } catch {
          flashBtn(settingsSaveBtn, 'Save failed', { error: true, resetText: 'Save & Reboot' });
        }
      });

      otaBtn.addEventListener('click', () => {
        const file = otaFileInput.files[0];
        if (!file) {
          flashBtn(otaBtn, 'Choose a .bin file', { error: true, resetText: 'Update Firmware' });
          return;
        }
        const formData = new FormData();
        formData.append('update', file);
        uploadWithProgress(`/ota?size=${file.size}`, formData, {
          button: otaBtn,
          uploadingText: 'Updating...',
          onSuccess: () => {
            flashBtn(otaBtn, 'Update complete, rebooting...', { resetText: null });
          },
          onError: () => {
            flashBtn(otaBtn, 'Update failed', { error: true, resetText: 'Update Firmware' });
          },
        });
      });

      // ── GIF upload ───────────────────────────────────────────────────────────

      // Validates a file as an acceptable GIF — checks size, magic bytes, and
      // canvas dimensions from the GIF logical screen descriptor (first 10 bytes):
      //   bytes 0–2: "GIF" magic, 3–5: version, 6–7: width, 8–9: height (little-endian)
      // Returns an error string, or null if valid.
      async function validate(file) {
        if (file.size > 1408 * 1024) return 'File must be under 1,408 KB';

        const headerBuffer = await file.slice(0, 10).arrayBuffer();
        const view = new DataView(headerBuffer);

        const magic = String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2));
        if (magic !== 'GIF') return 'File must be a GIF';

        const gifWidth = view.getUint16(6, /* littleEndian= */ true);
        const gifHeight = view.getUint16(8, /* littleEndian= */ true);
        if (gifWidth !== 240 || gifHeight !== 198) {
          return `GIF must be 240x198 (got ${gifWidth}x${gifHeight})`;
        }

        return null;
      }

      // Stages a file for upload: validates it and enables the upload button, or
      // clears the selection if null is passed.
      async function setFile(file) {
        selectedFile = file ?? null;
        setSelectionPill(file ? `Selected: ${file.name}` : null);
        fileInput.value = '';
        uploadBtn.disabled = true;
        uploadBtn.classList.remove('uploading', 'uploaded');
        uploadBtn.textContent = 'Upload';
        uploadBtn.style.color = '';
        if (!file) return;

        const error = await validate(file);
        if (error) {
          selectedFile = null;
          setSelectionPill(error, true);
        } else {
          uploadBtn.disabled = false;
        }
      }

      // Removes the selected highlight from whichever gallery item is active.
      function clearGallerySelection() {
        gallery.querySelector('.gallery-item.selected')?.classList.remove('selected');
      }

      fileInput.addEventListener('change', () => {
        clearGallerySelection();
        setFile(fileInput.files[0]);
      });

      dropZone.addEventListener('dragover', (event) => {
        event.preventDefault();
        dropZone.classList.add('over');
      });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
      dropZone.addEventListener('drop', (event) => {
        event.preventDefault();
        dropZone.classList.remove('over');
        const file = event.dataTransfer.files[0];
        if (file) {
          // Sync the hidden file input so it reflects the dropped file.
          fileInput.files = event.dataTransfer.files;
          setFile(file);
        }
      });

      uploadBtn.addEventListener('click', () => {
        const file = selectedFile;
        if (!file) return;
        const formData = new FormData();
        formData.append('upload', file);
        setSelectionPill(null);
        uploadWithProgress('/image', formData, {
          button: uploadBtn,
          uploadingText: 'Uploading...',
          onSuccess: () => {
            uploadBtn.textContent = 'Uploaded';
            uploadBtn.classList.add('uploaded');
            clearGallerySelection();
            setTimeout(() => {
              uploadBtn.textContent = 'Upload';
              uploadBtn.classList.remove('uploaded');
            }, 2000);
          },
          onError: () => {
            flashBtn(uploadBtn, 'Upload failed', { error: true, resetText: 'Upload' });
          },
        });
      });

      // ── Gallery ──────────────────────────────────────────────────────────────

      // Fetches pre-made GIFs from GitHub and populates the gallery grid.
      // Falls back silently to upload-only mode if the fetch fails.
      async function loadGallery() {
        try {
          const response = await fetch(
            'https://api.github.com/repos/loopj/gc-nano-jewel/contents/gifs',
          );
          if (!response.ok) return;

          const files = await response.json();
          const gifs = Array.isArray(files) ? files.filter((f) => f.name.endsWith('.gif')) : [];
          if (!gifs.length) return;

          for (const gif of gifs) {
            const item = document.createElement('div');
            item.className = 'gallery-item';

            const img = document.createElement('img');
            img.src = gif.download_url;
            img.title = gif.name;

            item.addEventListener('click', async () => {
              clearGallerySelection();
              item.classList.add('selected');

              // Clear any file input selection while the gallery GIF loads.
              setFile(null);
              setSelectionPill('Selected from gallery');

              try {
                // Fetch the GIF as a blob and wrap it in a File so it can be
                // passed to startUpload via the same upload path as local files.
                const response = await fetch(gif.download_url);
                const blob = await response.blob();
                selectedFile = new File([blob], gif.name, { type: 'image/gif' });
                uploadBtn.disabled = false;
              } catch {
                setSelectionPill(null);
                item.classList.remove('selected');
              }
            });

            item.appendChild(img);
            gallery.appendChild(item);
          }

          gallery.style.display = 'grid';
          uploadLabel.style.display = 'block';
          cardFront.classList.add('gallery-loaded');
        } catch {
          // Gallery unavailable — the device may be offline. Upload-only mode.
        }
      }

      loadGallery();
    </script>
  </body>
</html>
